---
name: Image

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  release:
    types: ["published"]
  workflow_dispatch: {}

permissions: {}

jobs:
  image:
    name: Build${{ github.event_name == 'release' && ' and push' || '' }}
    # x86_64 only: that is what the cluster nodes run.
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22

      - name: Build image
        # --accept-flake-config picks up the sofka binary cache declared in flake.nix
        run: nix build --accept-flake-config --print-build-logs .#image

      # Only releases publish an image, tagged with the release version and
      # nothing else: consumers pin a version (Renovate bumps it), never a
      # moving tag.
      - name: Push image
        if: github.event_name == 'release'
        env:
          IMAGE: ghcr.io/${{ github.repository }}
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          # The build result is a script that streams the layered tarball.
          ./result | nix run nixpkgs#skopeo -- copy --insecure-policy \
            --dest-creds "${REGISTRY_USER}:${REGISTRY_TOKEN}" \
            docker-archive:/dev/stdin "docker://${IMAGE}:${version}"
